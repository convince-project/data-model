# Problem 4 World
# Adds battery usage to actions.

metadata:
   locations: $PWD/location_data.yaml
   objects: $PWD/object_data.yaml

params:
  name: convince_world
  inflation_radius: 0.01
  object_radius: 0.01

robots:
  - name: robot
    radius: 0.1
    location: dining
    partial_obs_objects: true
    path_executor:
      type: constant_velocity
    path_planner:
      type: rrt
      bidirectional: true
      max_connection_dist: 0.5
      max_time: 10.0
    action_execution_options:
      navigate:
        success_probability: 0.9
        rng_seed: 42
        battery_usage: 0.5  # Per meter traveled
      pick:
        success_probability: 0.5
        battery_usage: 5
      place:
        success_probability: 0.5
        battery_usage: 5
      open:
        success_probability: 0.75
        battery_usage: 8
      close:
        success_probability: 0.75
        battery_usage: 8
      detect:
        success_probability: 0.8
        battery_usage: 0

rooms:
  - name: dining
    footprint:
      type: polygon
      coords:
        - [-3, 3]
        - [-3, 1]
        - [-1, 1]
        - [-1, 3]
    wall_width: 0.2
    color: "#FA9F00"

  - name: kitchen
    footprint:
      type: polygon
      coords:
        - [-3, -3]
        - [-3, -1]
        - [-1, -1]
        - [-1, -3]
    wall_width: 0.2
    color: "#009A95"

  - name: trash
    footprint:
      type: polygon
      coords:
        - [3, -3]
        - [3, -1]
        - [1, -1]
        - [1, -3]
    wall_width: 0.2
    color: "#F70063"

hallways:
  - room_start: dining
    room_end: kitchen
    width: 0.6
    wall_width: 0.05
    conn_method: angle
    conn_angle: -1.57
    offset: 0
    is_open: true
    is_locked: false

  - room_start: kitchen
    room_end: trash
    width: 0.6
    wall_width: 0.05
    conn_method: angle
    conn_angle: 0
    offset: 0
    is_open: faltruese
    is_locked: false

  - room_start: dining
    room_end: trash
    width: 0.6
    wall_width: 0.05
    conn_method: angle
    conn_angle: -0.77
    offset: .9
    is_open: true
    is_locked: false

locations:
    - name: table
      parent: dining
      category: table
      pose:
        position:
          x: 0.0
          y: 0.6

objects:
  - parent: table
    category: soda
